{% extends "base.html" %}

{% block title %}Reset Password | FoodShare{% endblock %}

{% block extra_css %}
<style>
    .reset-page {
        max-width: 460px;
        margin: 55px auto;
        padding: 32px;
        background: #fff;
        border: 1px solid #e0ebe3;
        border-radius: 20px;
        box-shadow: 0 12px 35px rgba(20, 55, 35, .08);
    }

    .reset-page h1 {
        color: #174c35;
        font-size: 28px;
    }

    .reset-page p {
        color: #66756b;
        line-height: 1.6;
    }

    .reset-page label {
        display: block;
        margin: 18px 0 8px;
        font-weight: 600;
    }

    .reset-page input {
        width: 100%;
        box-sizing: border-box;
        padding: 13px;
        border: 1px solid #d4e2d7;
        border-radius: 10px;
        font-size: 15px;
    }

    .reset-button {
        width: 100%;
        margin-top: 22px;
        padding: 14px;
        border: 0;
        border-radius: 10px;
        background: #218447;
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
    }
</style>
{% endblock %}

{% block content %}
<section class="reset-page">
    <h1>Create a New Password</h1>
    <p>Choose a new password for your FoodShare account.</p>

    <form method="POST" action="{{ url_for('reset_password') }}">
        <label for="password">New password</label>

        <input
            type="password"
            id="password"
            name="password"
            minlength="8"
            autocomplete="new-password"
            placeholder="At least 8 characters"
            required
        >

        <label for="confirm_password">Confirm new password</label>

        <input
            type="password"
            id="confirm_password"
            name="confirm_password"
            minlength="8"
            autocomplete="new-password"
            placeholder="Re-enter new password"
            required
        >

        <button class="reset-button" type="submit">
            Update Password
        </button>
    </form>
</section>
{% endblock %}
